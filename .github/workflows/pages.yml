name: Publicar AVESSO
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar sintaxe do aplicativo
        run: |
          node --check app.js
          node --check config.js
      - name: Validar presença e integridade da arte original
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          art = Path("assets/avesso-hero-original.png")
          if not art.is_file():
              raise SystemExit("Arquivo original ainda não enviado: assets/avesso-hero-original.png")
          digest = hashlib.sha256(art.read_bytes()).hexdigest()
          expected = "d9454e93bda7f280322943a9d539966f73c6c424324a8a9e7d769a7c04bf6810"
          assert digest == expected, "O PNG enviado difere da arte original íntegra."
          html = Path("index.html").read_text(encoding="utf-8")
          css = Path("styles.css").read_text(encoding="utf-8")
          assert 'src="assets/avesso-hero-original.png"' in html
          assert ".hero-art img{width:100%;height:auto;" in css
          print("Arte original íntegra, com caminho e proporção corretos.")
          PY
  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
