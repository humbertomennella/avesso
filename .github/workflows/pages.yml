name: Publicar AVESSO
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar sintaxe do aplicativo
        run: |
          node --check app.js
          node --check config.js
      - name: Verificar arquivo da arte da home
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          root = ET.parse("assets/avesso-hero.svg").getroot()
          assert root.tag == "{http://www.w3.org/2000/svg}svg"
          assert root.attrib["viewBox"] == "0 0 1600 700"
          assert 'src="assets/avesso-hero.svg"' in Path("index.html").read_text(encoding="utf-8")
          print("Arte SVG válida e corretamente referenciada.")
          PY
  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
