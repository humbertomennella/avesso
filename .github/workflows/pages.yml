name: Publicar AVESSO
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar sintaxe do aplicativo
        run: |
          node --input-type=module --check < app.js
          node --input-type=module --check < config.js
          node --input-type=module --check < economy-shadow.js
          node --input-type=module --check < polish.js
          node --input-type=module --check < release-controller.js
          node --input-type=module --check < story-media-compat.js
          node --input-type=module --check < avesso-ui.js
          node --input-type=module --check < account-center.js
          node --input-type=module --check < tests/smoke.spec.js
          node --input-type=module --check < playwright.config.js
          node --check mobile.js
          node --check mobile-ux.js
          node --check desktop-ux.js
          node --check sw.js
      - name: Conferir contratos críticos de UX e privacidade
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          html = Path('index.html').read_text(encoding='utf-8')
          app = Path('app.js').read_text(encoding='utf-8')
          config = Path('config.js').read_text(encoding='utf-8')
          economy = Path('economy-shadow.js').read_text(encoding='utf-8')
          polish = Path('polish.js').read_text(encoding='utf-8')
          polish_css = Path('polish.css').read_text(encoding='utf-8')
          release = Path('release-controller.js').read_text(encoding='utf-8')
          release_css = Path('release-controller.css').read_text(encoding='utf-8')
          media = Path('story-media-compat.js').read_text(encoding='utf-8')
          ui = Path('avesso-ui.js').read_text(encoding='utf-8')
          ui_css = Path('avesso-ui.css').read_text(encoding='utf-8')
          account = Path('account-center.js').read_text(encoding='utf-8')
          sw = Path('sw.js').read_text(encoding='utf-8')

          ids = re.findall(r'\bid=["\']([^"\']+)["\']', html)
          duplicates = sorted({value for value in ids if ids.count(value) > 1})
          assert not duplicates, f'IDs duplicados no index.html: {duplicates}'

          assert 'data-auth-mode="signup"' in html
          assert 'data-auth-mode="login"' in html
          assert 'id="auth-form"' in html
          assert 'id="auth-submit"' in html
          assert "import './polish.js';" in config
          assert "import './release-controller.js';" in config
          assert "import './story-media-compat.js';" in config
          assert "import './avesso-ui.js';" in config
          assert "import('./economy-shadow.js')" in config
          assert 'Element.prototype.forEach' not in config
          assert 'Element.prototype.forEach' not in polish
          assert 'AUTH_TAB_LEGACY_BRIDGE' in polish
          assert "import(`./account-center.js" in polish
          assert "account-export" in account
          assert "account-delete" in account
          assert "resetPasswordForEmail" in account
          assert "signOut({scope:'others'})" in account

          assert '/rest/v1/rpc/avesso_economy_heartbeat' in economy
          assert "body:'{}'" in economy
          assert 'ACTIVE_WINDOW_MS=120000' in economy
          assert 'HEARTBEAT_MS=60000' in economy
          assert 'document.visibilityState' in economy
          assert 'amount' not in economy.lower(), 'cliente shadow não pode escolher valor de recompensa'

          legacy = re.findall(r"(?<!\$)\$\([^)]*\)\.forEach", app)
          unexpected = [item for item in legacy if 'data-auth-mode' not in item]
          assert not unexpected, f'querySelector(...).forEach fora do auth: {unexpected[:3]}'
          assert len([item for item in legacy if 'data-auth-mode' in item]) == 2, \
              'O bridge de auth precisa ser revisto: quantidade de chamadas legadas mudou.'

          assert "const SHELL_CACHE='avesso-shell-v31'" in sw
          for asset in ['./polish.js','./polish.css','./release-controller.js','./release-controller.css','./story-media-compat.js','./avesso-ui.js','./avesso-ui.css','./account-center.js','./account-center.css','./economy-shadow.js']:
              assert repr(asset) in sw or f"'{asset}'" in sw, f'{asset} fora do shell offline'

          assert 'DESKTOP LAYOUT CONTRACT 2026-10-03' in polish_css
          assert '.desktop-chat-shelf{display:none!important}' in polish_css
          assert 'position:fixed!important' in polish_css
          assert 'max-width:860px!important' in polish_css
          assert '--avesso-profile-avatar-size' in polish_css

          assert '--avesso-desktop-nav:252px!important' in release_css
          assert '#avesso-release-indicator' not in release_css
          assert '.avesso-release-indicator' in release_css
          assert "UPDATE_CHECK_MS=60_000" in release
          assert "AUTO_RESTART_SECONDS=5" in release
          assert "window.addEventListener('avesso:update-ready',handleUpdateReady)" in release
          assert 'hasUnsavedWork()' in release
          assert 'location.reload()' in release
          assert 'navigator.vibrate' in release

          assert '__avessoStoryPlaybackCompat=true' in media
          assert "response.arrayBuffer()" in media
          assert "video.preload='auto'" in media
          assert "UI_VERSION='20261003-ui2'" in ui
          assert '--avesso-font-pixel' in ui_css
          assert 'Press Start 2P' in ui_css
          assert '--avesso-desktop-nav:264px!important' in ui_css
          assert '--avesso-desktop-nav:76px!important' in ui_css
          assert 'width:50px!important' in ui_css
          assert 'height:44px!important' in ui_css
          assert 'navigation rail real' in ui_css
          assert '#online-friends-dock' in ui_css

          for path in [
              'PRIVACIDADE.md','TERMOS.md',
              'supabase/migrations/20261003030000_account_privacy_audit.sql',
              'supabase/migrations/20261004112531_economia_avesso_shadow_mode_true_v1.sql',
              'supabase/migrations/20261004113742_economia_avesso_shadow_telemetry_v1.sql',
              'supabase/migrations/20261004114131_economia_avesso_shadow_audit_v1.sql'
          ]:
              assert Path(path).is_file(), f'{path} ausente'

          print('Contratos críticos de UX, autenticação, economia shadow, desktop, vídeo, atualização e privacidade conferidos.')
          PY
      - name: Conferir fluxo comunitário e regras versionadas
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          app = Path("app.js").read_text(encoding="utf-8")
          migration = Path("supabase/migrations/20260929203030_feed_publicacoes_comunitarias.sql").read_text(encoding="utf-8").lower()
          assert '<option value="community">Para a comunidade (sem @)</option>' in html
          assert '<option value="person">Para uma pessoa (@)</option>' in html
          assert 'recipient_id:directed?state.recipient.id:null' in app
          assert "visibility:directed?$('#post-visibility').value:'publico'" in app
          assert "p.recipient_id?escapeHtml(p.recipient_name||'pessoa'):'comunidade'" in app
          assert "recipient_id drop not null" in migration
          assert "posts_target_visibility_check" in migration
          assert "security_invoker = true" in migration
          assert "left join public.profiles r on r.id=p.recipient_id" in migration
          print("Contratos de publicações comunitárias e mensagens dirigidas conferidos.")
          PY
      - name: Validar presença e integridade da arte original
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          art = Path("assets/avesso-hero-original.png")
          if not art.is_file():
              raise SystemExit("Arquivo original ainda não enviado: assets/avesso-hero-original.png")
          digest = hashlib.sha256(art.read_bytes()).hexdigest()
          expected = {"d9454e93bda7f280322943a9d539966f73c6c424324a8a9e7d769a7c04bf6810", "69e1aeac32538031257ad315196733e1f69cfc5bb9a7d405dadb91f34fe435f4"}
          assert digest in expected, "O PNG enviado difere das duas cópias originais, idênticas em pixels."
          html = Path("index.html").read_text(encoding="utf-8")
          css = Path("styles.css").read_text(encoding="utf-8")
          assert 'src="assets/avesso-hero-original.png"' in html
          assert ".hero-art img{width:100%;height:auto;" in css
          print("Arte original íntegra, com caminho e proporção corretos.")
          PY
      - name: Instalar navegadores para smoke tests
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium firefox webkit
      - name: Executar smoke tests multi-navegador em desktop e mobile
        run: npx playwright test --workers=1
  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
