name: Diagnosticar smoke AVESSO
on:
  push:
    branches: [reskin-poster-rockstar]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Playwright
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium firefox webkit
      - id: auth
        name: SMOKE 1 — autenticação
        continue-on-error: true
        run: npx playwright test --grep "fluxo de autenticação"
      - id: overflow
        name: SMOKE 2 — overflow landing/auth
        if: always()
        continue-on-error: true
        run: npx playwright test --grep "overflow horizontal"
      - id: legal
        name: SMOKE 3 — documentos legais
        if: always()
        continue-on-error: true
        run: npx playwright test --grep "documentos legais"
      - id: story_mime
        name: SMOKE 4 — Story MIME
        if: always()
        continue-on-error: true
        run: npx playwright test --grep "parâmetros de codec"
      - id: story_playback
        name: SMOKE 5 — Story playback
        if: always()
        continue-on-error: true
        run: npx playwright test --grep "reprodução do Story"
      - id: desktop_layout
        name: SMOKE 6 — desktop layout
        if: always()
        continue-on-error: true
        run: npx playwright test --grep "desktop mantém laterais"
      - id: desktop_wide
        name: SMOKE 7 — desktop largo
        if: always()
        continue-on-error: true
        run: npx playwright test --grep "desktop largo preserva"
      - id: nav_collapsed
        name: SMOKE 8 — sidebar recolhida
        if: always()
        continue-on-error: true
        run: npx playwright test --grep "sidebar recolhida"
      - id: release
        name: SMOKE 9 — atualização automática
        if: always()
        continue-on-error: true
        run: npx playwright test --grep "nova versão avisa"
      - name: FALHA — autenticação
        if: ${{ always() && steps.auth.outcome == 'failure' }}
        run: exit 1
      - name: FALHA — overflow landing/auth
        if: ${{ always() && steps.overflow.outcome == 'failure' }}
        run: exit 1
      - name: FALHA — documentos legais
        if: ${{ always() && steps.legal.outcome == 'failure' }}
        run: exit 1
      - name: FALHA — Story MIME
        if: ${{ always() && steps.story_mime.outcome == 'failure' }}
        run: exit 1
      - name: FALHA — Story playback
        if: ${{ always() && steps.story_playback.outcome == 'failure' }}
        run: exit 1
      - name: FALHA — desktop layout
        if: ${{ always() && steps.desktop_layout.outcome == 'failure' }}
        run: exit 1
      - name: FALHA — desktop largo
        if: ${{ always() && steps.desktop_wide.outcome == 'failure' }}
        run: exit 1
      - name: FALHA — sidebar recolhida
        if: ${{ always() && steps.nav_collapsed.outcome == 'failure' }}
        run: exit 1
      - name: FALHA — atualização automática
        if: ${{ always() && steps.release.outcome == 'failure' }}
        run: exit 1
