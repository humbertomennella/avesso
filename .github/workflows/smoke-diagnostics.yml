name: Diagnosticar smoke AVESSO
on:
  push:
    branches: [reskin-poster-rockstar]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Playwright
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium firefox webkit

      - id: story_dc
        name: STORY PLAYBACK — desktop Chromium
        continue-on-error: true
        run: npx playwright test --grep "reprodução do Story" --project=desktop-chromium
      - id: story_df
        name: STORY PLAYBACK — desktop Firefox
        if: always()
        continue-on-error: true
        run: npx playwright test --grep "reprodução do Story" --project=desktop-firefox
      - id: story_dw
        name: STORY PLAYBACK — desktop WebKit
        if: always()
        continue-on-error: true
        run: npx playwright test --grep "reprodução do Story" --project=desktop-webkit
      - id: story_mc
        name: STORY PLAYBACK — mobile Chromium
        if: always()
        continue-on-error: true
        run: npx playwright test --grep "reprodução do Story" --project=mobile-chromium
      - id: story_mw
        name: STORY PLAYBACK — mobile WebKit
        if: always()
        continue-on-error: true
        run: npx playwright test --grep "reprodução do Story" --project=mobile-webkit

      - id: nav_dc
        name: SIDEBAR — desktop Chromium
        if: always()
        continue-on-error: true
        run: npx playwright test --grep "sidebar recolhida" --project=desktop-chromium
      - id: nav_df
        name: SIDEBAR — desktop Firefox
        if: always()
        continue-on-error: true
        run: npx playwright test --grep "sidebar recolhida" --project=desktop-firefox
      - id: nav_dw
        name: SIDEBAR — desktop WebKit
        if: always()
        continue-on-error: true
        run: npx playwright test --grep "sidebar recolhida" --project=desktop-webkit
      - id: nav_mc
        name: SIDEBAR — mobile Chromium
        if: always()
        continue-on-error: true
        run: npx playwright test --grep "sidebar recolhida" --project=mobile-chromium
      - id: nav_mw
        name: SIDEBAR — mobile WebKit
        if: always()
        continue-on-error: true
        run: npx playwright test --grep "sidebar recolhida" --project=mobile-webkit

      - name: FALHA — Story desktop Chromium
        if: ${{ always() && steps.story_dc.outcome == 'failure' }}
        run: exit 1
      - name: FALHA — Story desktop Firefox
        if: ${{ always() && steps.story_df.outcome == 'failure' }}
        run: exit 1
      - name: FALHA — Story desktop WebKit
        if: ${{ always() && steps.story_dw.outcome == 'failure' }}
        run: exit 1
      - name: FALHA — Story mobile Chromium
        if: ${{ always() && steps.story_mc.outcome == 'failure' }}
        run: exit 1
      - name: FALHA — Story mobile WebKit
        if: ${{ always() && steps.story_mw.outcome == 'failure' }}
        run: exit 1
      - name: FALHA — Sidebar desktop Chromium
        if: ${{ always() && steps.nav_dc.outcome == 'failure' }}
        run: exit 1
      - name: FALHA — Sidebar desktop Firefox
        if: ${{ always() && steps.nav_df.outcome == 'failure' }}
        run: exit 1
      - name: FALHA — Sidebar desktop WebKit
        if: ${{ always() && steps.nav_dw.outcome == 'failure' }}
        run: exit 1
      - name: FALHA — Sidebar mobile Chromium
        if: ${{ always() && steps.nav_mc.outcome == 'failure' }}
        run: exit 1
      - name: FALHA — Sidebar mobile WebKit
        if: ${{ always() && steps.nav_mw.outcome == 'failure' }}
        run: exit 1
